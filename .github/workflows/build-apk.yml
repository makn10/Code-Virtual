name: Build Debug APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          java -version

          VERSION_OUTPUT="$(java -version 2>&1 || true)"
          RAW_VERSION="$(printf '%s\n' "$VERSION_OUTPUT" | sed -n 's/.*version "\([^"]*\)".*/\1/p' | head -n 1)"
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Failed to detect active Java version from 'java -version'."
            exit 1
          fi

          if [[ "$RAW_VERSION" == 1.* ]]; then
            MAJOR_VERSION="$(printf '%s' "$RAW_VERSION" | cut -d. -f2)"
          else
            MAJOR_VERSION="$(printf '%s' "$RAW_VERSION" | cut -d. -f1 | sed 's/[^0-9].*$//')"
          fi

          if [ -z "$MAJOR_VERSION" ] || ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse Java major version from '$RAW_VERSION'."
            exit 1
          fi

          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VERSION."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Accept Android SDK licenses if sdkmanager is present
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ./debug.keystore ]; then
            "${JAVA_HOME}/bin/keytool" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f ./debug.keystore ] || [ ! -s ./debug.keystore ]; then
            echo "::error::Temporary ./debug.keystore could not be created."
            exit 1
          fi
          echo "Temporary debug keystore is ready at ./debug.keystore."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected debug APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APKs inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::$APK_PATH exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH is empty."
            exit 1
          fi

          if [[ "$APK_PATH" != *.apk ]]; then
            echo "::error::$APK_PATH does not have the .apk extension."
            exit 1
          fi

          echo "Verified debug APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified APK missing at $SOURCE_APK"
            exit 1
          fi

          RELEASE_ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")"
          RAW_REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO_NAME="$(printf '%s' "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${RELEASE_ASSET_DIR}/${ASSET_FILENAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset validation failed at $ASSET_PATH"
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset is missing or invalid: ${ASSET_PATH:-<empty>}"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE="$(mktemp "${RUNNER_TEMP}/release-notes-XXXXXX.md")"

          {
            printf '%s\n' "Automatically generated debug APK built by GitHub Actions."
            printf '\n'
            printf '%s\n' "- **Workflow Run Number**: ${GITHUB_RUN_NUMBER}"
            printf '%s\n' "- **Workflow Run Attempt**: ${GITHUB_RUN_ATTEMPT}"
            printf '%s\n' "- **Source Commit SHA**: ${GITHUB_SHA}"
            printf '%s\n' "- **APK Asset**: \`${ASSET_FILENAME}\`"
            printf '\n'
            printf '%s\n' "### Important Notice"
            printf '%s\n' "- This APK is intended for testing only."
            printf '%s\n' "- This APK is **not** a Play Store production release."
            printf '%s\n' "- This APK is signed only with a temporary debug keystore."
          } > "$NOTES_FILE"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: ${{ steps.publish_release.outcome == 'success' || steps.publish_release.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_FILENAME}"
            gh release view "$RELEASE_TAG"

            {
              echo "### Debug APK Build & GitHub Release Succeeded"
              echo ""
              echo "- **Release Title**: ${RELEASE_TITLE}"
              echo "- **Release Tag**: \`${RELEASE_TAG}\`"
              echo "- **Release Page**: ${RELEASE_URL}"
              echo "- **Downloadable APK Asset**: \`${ASSET_FILENAME}\` (available directly under the release **Assets** section)"
              echo "- **Backup Artifact**: GitHub Actions artifact \`app-debug-apk\` is also available for download."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed for tag ${RELEASE_TAG}, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              echo "### Debug APK Build Succeeded (Release Publishing Failed)"
              echo ""
              echo "> **Warning**: Publishing to GitHub Releases failed, so no release URL was created."
              echo ""
              echo "- **APK Build**: Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Backup Download**: Download the GitHub Actions artifact named \`app-debug-apk\` from this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
